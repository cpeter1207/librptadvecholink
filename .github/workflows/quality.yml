name: Required quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    uses: cpeter1207/rptadv-shared-library-workflows/.github/workflows/quality.yml@main
    with:
      code_ref: ${{ github.sha }}
      full: ${{ github.event_name != 'push' }}
      quality_image: ghcr.io/cpeter1207/rptadv-echolink-quality-debian13:latest
