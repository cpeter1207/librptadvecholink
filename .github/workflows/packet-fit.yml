name: Packet compatibility

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        default: packet
        options: [packet, abi, wire]

permissions:
  contents: read

jobs:
  packet-fit:
    uses: cpeter1207/librptadvecholink-workflows/.github/workflows/packet-fit.yml@feature/echolink-validation
    with:
      code_ref: ${{ github.sha }}
      target: ${{ inputs.target || 'packet' }}
