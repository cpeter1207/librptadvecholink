[package]
name = "librptadvecholink"
version = "0.1.0-alpha1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
publish = false
description = "EchoLink protocol provider for RPT Advanced"

[lib]
name = "rptadv_echolink"
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap = "=1.9.3"
bytes = "1"
flate2 = "1.1.10"
md-5 = "=0.10.6"
libloading = "0.8"
rptadv-codec-client = { git = "https://github.com/cpeter1207/rptadv-codec-adapters", rev = "becbff939a0817cc91df6dcb0d40e85e381ec87b" }
rptadv-jitter-client = { git = "https://github.com/cpeter1207/rpt_advanced", rev = "a151c00450937c5316607c80cd37bbedb12fc5e0" }
rptadv-peer-support = { git = "https://github.com/cpeter1207/rpt_advanced", rev = "b3e885dbf89f3338e46d0bdd7f478702c5c57142" }
rtp = "=0.12.0"
rtcp = "=0.12.0"
webrtc-util = { version = "=0.10.0", default-features = false, features = ["marshal"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "packet_library_fit"
path = "tests/packet_library_fit.rs"
