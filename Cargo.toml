[package]
name = "librptadvecholink"
version = "0.1.0-alpha1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-only"
publish = false
description = "EchoLink protocol provider for RPT Advanced"

[lib]
name = "rptadv_echolink"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
flate2 = "1.1.10"
rtp = "=0.12.0"
rtcp = "=0.12.0"
webrtc-util = { version = "=0.10.0", default-features = false, features = ["marshal"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "packet_library_fit"
path = "tests/packet_library_fit.rs"
